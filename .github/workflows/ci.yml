name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash helper/build.sh build/DSHNotify.app
      - run: plutil -lint build/DSHNotify.app/Contents/Info.plist
      - run: test -x build/DSHNotify.app/Contents/MacOS/DSHNotify
